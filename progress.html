<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06110c"><title>FitSync — Progress</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><main>
<section class="page-head"><h1 class="page-title">Progress</h1><div class="page-subtitle">See today's progress, your weekly trend and your weight journey.</div></section>
<section class="card"><h2 class="card-title">Today's progress</h2><div id="todayProgress"></div></section>
<section class="card section"><h2 class="card-title">Goal progress</h2><div class="stat-grid"><div class="stat"><div class="stat-label">Start weight</div><div class="stat-value" id="startWeight">75 kg</div></div><div class="stat"><div class="stat-label">Current weight</div><div class="stat-value" id="currentWeight">75 kg</div></div><div class="stat"><div class="stat-label">Goal weight</div><div class="stat-value" id="goalWeight">68 kg</div></div><div class="stat"><div class="stat-label">Goal progress</div><div class="stat-value" id="goalPct">0%</div></div></div><div class="bar" style="margin-top:16px"><i id="goalBar"></i></div></section>
<section class="card section"><h2 class="card-title">Weekly progress</h2><div id="weeklyProgress"></div></section>
<section class="card section"><h2 class="card-title">Weekly result</h2><div id="weeklyResult" class="notice"></div></section>
</main></div><script type="module" src="auth-guard.js"></script><script src="core.js"></script><script src="progress.js"></script></body></html>
