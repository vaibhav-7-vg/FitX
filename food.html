<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06110c"><title>FitSync — Food</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><main>
<section class="page-head"><h1 class="page-title">Food</h1><div class="page-subtitle">Tell FitSync what you ate and let the nutrition assistant estimate it.</div></section>
<section class="card"><h2 class="card-title">Food AI</h2><textarea id="foodInput" placeholder='Tell me what you ate. Example: "I ate 2 eggs and 1 banana."'></textarea><button class="btn" style="margin-top:12px" id="analyzeBtn">Analyze food</button><div id="foodResult" style="margin-top:14px"></div></section>
<section class="card section"><h2 class="card-title">Today's nutrition</h2><div class="target-grid"><div class="target-box"><div class="muted">Calories</div><div class="target-value" id="todayCal">0</div></div><div class="target-box"><div class="muted">Protein</div><div class="target-value" id="todayPro">0 g</div></div><div class="target-box"><div class="muted">Fiber</div><div class="target-value" id="todayFiber">0 g</div></div><div class="target-box"><div class="muted">Foods logged</div><div class="target-value" id="foodCount">0</div></div></div></section>
<section class="card section"><h2 class="card-title">Food history</h2><div id="foodHistory" class="history-empty">No foods logged today.</div></section>
</main></div><script type="module" src="auth-guard.js"></script><script src="core.js"></script><script src="food.js"></script></body></html>
