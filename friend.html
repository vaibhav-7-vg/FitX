<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06110c"><title>FitSync — Friend</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><main>
<section class="page-head"><h1 class="page-title">Friend</h1><div class="page-subtitle">Connect with your friend and compare progress.</div></section>
<section class="card"><h2 class="card-title">Friend connection</h2><div class="form-group"><label>Friend Code</label><input id="friendCode" placeholder="Enter your friend's code"></div><button class="btn" id="connectBtn">Connect</button><div id="connectMsg" style="margin-top:12px"></div></section>
<section class="card section compare-hero" id="compareHero"><div class="small-title">Compare with points</div><div class="compare-scores" style="margin-top:12px"><div><div class="big-score" id="myScore">0</div><div class="muted">Your points</div></div><div class="vs">VS</div><div><div class="big-score" id="friendScore">0</div><div class="muted">Friend's points</div></div></div><div id="winnerText" class="badge gray" style="margin-top:18px">Connect a friend to compare</div></section>
<section class="card section"><h2 class="card-title">Points comparison</h2><div class="table-wrap"><table><thead><tr><th>Metric</th><th>You</th><th>Friend</th><th>Difference</th></tr></thead><tbody id="compareTable"></tbody></table></div></section>
</main></div><script src="core.js"></script><script src="friend.js"></script></body></html>
