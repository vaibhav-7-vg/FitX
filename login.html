<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>FitSync — Login</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="auth-page">
<section class="auth-card">
<div class="auth-brand">
<div class="brand-icon">F</div>
<div>
<h1>FitSync</h1>
<p>Track yourself. Improve together.</p>
</div>
</div>

<div class="auth-tabs">
<button id="loginTab" class="auth-tab active" type="button">Login</button>
<button id="signupTab" class="auth-tab" type="button">Create Account</button>
</div>

<form id="loginForm">
<h2>Welcome back</h2>
<p class="auth-subtitle">Login to continue to FitSync.</p>

<label>Email</label>
<input id="loginEmail" type="email" autocomplete="email" placeholder="Enter your email" required>

<label>Password</label>
<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required>

<button class="primary-btn" type="submit">Login</button>

<button id="forgotBtn" class="text-btn" type="button">Forgot password?</button>
</form>

<form id="signupForm" class="hidden">
<h2>Create your account</h2>
<p class="auth-subtitle">Start your FitSync journey.</p>

<label>Name</label>
<input id="signupName" type="text" autocomplete="name" placeholder="Enter your name" required>

<label>Email</label>
<input id="signupEmail" type="email" autocomplete="email" placeholder="Enter your email" required>

<label>Password</label>
<input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required>

<label>Confirm password</label>
<input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Confirm your password" minlength="6" required>

<button class="primary-btn" type="submit">Create Account</button>
</form>

<div id="authMessage" class="auth-message"></div>

<p class="auth-note">Your account is secured by Firebase Authentication.</p>
</section>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,updateProfile,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAGkwXarUC1LCjqIjVnCc1OCKQzbsENokA",
authDomain:"fitsync-a7d0e.firebaseapp.com",
projectId:"fitsync-a7d0e",
storageBucket:"fitsync-a7d0e.firebasestorage.app",
messagingSenderId:"934279400181",
appId:"1:934279400181:web:98ce71d045581a712913bc"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const loginTab=document.getElementById("loginTab");
const signupTab=document.getElementById("signupTab");
const loginForm=document.getElementById("loginForm");
const signupForm=document.getElementById("signupForm");
const message=document.getElementById("authMessage");

function showMessage(text,type=""){
message.textContent=text;
message.className="auth-message "+type;
}

loginTab.onclick=()=>{
loginTab.classList.add("active");
signupTab.classList.remove("active");
loginForm.classList.remove("hidden");
signupForm.classList.add("hidden");
showMessage("");
};

signupTab.onclick=()=>{
signupTab.classList.add("active");
loginTab.classList.remove("active");
signupForm.classList.remove("hidden");
loginForm.classList.add("hidden");
showMessage("");
};

loginForm.onsubmit=async e=>{
e.preventDefault();
const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

try{
showMessage("Logging in...","loading");
await signInWithEmailAndPassword(auth,email,password);
showMessage("Login successful.","success");
setTimeout(()=>location.href="index.html",500);
}catch(error){
showMessage(getError(error),"error");
}
};

signupForm.onsubmit=async e=>{
e.preventDefault();

const name=document.getElementById("signupName").value.trim();
const email=document.getElementById("signupEmail").value.trim();
const password=document.getElementById("signupPassword").value;
const confirm=document.getElementById("signupConfirm").value;

if(password!==confirm){
showMessage("Passwords do not match.","error");
return;
}

try{
showMessage("Creating your account...","loading");

const credential=await createUserWithEmailAndPassword(auth,email,password);

await updateProfile(credential.user,{displayName:name});

await setDoc(doc(db,"users",credential.user.uid),{
uid:credential.user.uid,
name:name,
email:email,
createdAt:serverTimestamp()
},{merge:true});

showMessage("Account created successfully.","success");
setTimeout(()=>location.href="profile.html",700);
}catch(error){
showMessage(getError(error),"error");
}
};

document.getElementById("forgotBtn").onclick=async()=>{
const email=document.getElementById("loginEmail").value.trim();

if(!email){
showMessage("Enter your email first.","error");
return;
}

try{
await sendPasswordResetEmail(auth,email);
showMessage("Password reset email sent. Check your inbox.","success");
}catch(error){
showMessage(getError(error),"error");
}
};

function getError(error){
switch(error.code){
case"auth/email-already-in-use":return"An account with this email already exists.";
case"auth/invalid-email":return"Please enter a valid email.";
case"auth/weak-password":return"Password should be at least 6 characters.";
case"auth/invalid-credential":return"Email or password is incorrect.";
case"auth/user-not-found":return"No account found with this email.";
case"auth/wrong-password":return"Incorrect password.";
case"auth/too-many-requests":return"Too many attempts. Try again later.";
default:return error.message||"Something went wrong.";
}
}

onAuthStateChanged(auth,user=>{
if(user&&!location.pathname.endsWith("login.html")){
location.href="index.html";
}
});
</script>
</body>
</html>
